<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07c160">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>刷题题库</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <!-- 顶部 -->
  <header id="topbar">
    <h1 id="viewTitle">导入题库</h1>
    <div class="top-right">
      <div id="statPill" class="stat-pill"></div>
      <button class="theme-btn" id="themeBtn" aria-label="切换深浅色主题" title="切换深浅色">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 内容区 -->
  <main id="content">

    <!-- 导入视图 -->
    <section class="view" id="view-import">
      <div class="card">
        <div class="card-title">选择题库文件</div>
        <p class="hint">支持 Excel（.xlsx / .xls）和 Word（.docx），自动识别题型。<br>.doc 旧格式请用 Word 另存为 .docx。</p>
        <label class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" accept=".xlsx,.xls,.docx">
          <div class="drop-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div class="drop-title">拖拽文件到这里，或点击选择</div>
          <div class="drop-hint">支持 .xlsx / .xls / .docx，单个文件不超过 20MB<br>.doc 旧格式请先用 Word 另存为 .docx</div>
        </label>
        <div id="parseStatus" class="status"></div>
      </div>

      <div class="card" id="sheetCard" hidden>
        <div class="card-title">选择工作表</div>
        <div id="sheetList"></div>
      </div>

      <div class="card" id="previewCard" hidden>
        <div class="card-title">预览校对
          <span class="muted" id="previewSummary"></span>
        </div>
        <div class="filter-row">
          <label class="check"><input type="checkbox" id="onlyProblem"> 只看有问题的</label>
        </div>
        <div id="previewList"></div>
      </div>

      <div class="card" id="batchCard">
        <div class="card-title">已导入批次</div>
        <div id="batchList"></div>
      </div>

      <div class="card sub-nav-card" id="gotoBank">
        <div class="sub-nav-row">
          <span class="sub-nav-icon">库</span>
          <span class="sub-nav-name">题库管理</span>
          <span class="muted" id="bankSubCount"></span>
          <span class="sub-nav-arrow">›</span>
        </div>
      </div>

      <div class="card">
        <button class="btn btn-danger btn-block" id="clearAllBtn">清空所有数据</button>
      </div>
    </section>

    <!-- 题库视图 -->
    <section class="view" id="view-bank" hidden>
      <div class="back-bar">
        <button class="back-btn" id="bankBack">‹ 返回</button>
        <span class="back-title">题库管理</span>
      </div>
      <div class="card">
        <div class="card-title">已导入文档
          <button class="btn btn-sm" id="exportBank">导出题库</button>
        </div>
        <div id="bankList"></div>
      </div>
    </section>

    <!-- 练习视图（考试宝式：模式入口 + 答题卡 + 收藏） -->
    <section class="view" id="view-practice" hidden>
      <div class="card" id="setupCard">
        <div class="card-title">选择练习模式</div>
        <div class="mode-grid">
          <button class="mode-card" data-mode="normal"><span class="mode-icon mode-green">顺</span><span class="mode-name">顺序练习</span><span class="mode-sub"></span></button>
          <button class="mode-card" data-mode="random"><span class="mode-icon mode-blue">随</span><span class="mode-name">随机练习</span><span class="mode-sub"></span></button>
          <button class="mode-card" data-mode="type"><span class="mode-icon mode-purple">型</span><span class="mode-name">题型练习</span><span class="mode-sub"></span></button>
          <button class="mode-card" data-mode="chapter"><span class="mode-icon mode-amber">章</span><span class="mode-name">章节练习</span><span class="mode-sub"></span></button>
          <button class="mode-card" data-mode="wrong"><span class="mode-icon mode-red">错</span><span class="mode-name">错题重做</span><span class="mode-sub"></span></button>
          <button class="mode-card" data-mode="fav"><span class="mode-icon mode-orange">藏</span><span class="mode-name">收藏练习</span><span class="mode-sub"></span></button>
        </div>

        <div class="panel" id="typePanel" hidden>
          <div class="card-title">选择题型</div>
          <div class="type-tabs" id="typePick"></div>
          <button class="btn btn-primary btn-block" id="startTypeBtn">开始练习</button>
        </div>

        <div class="panel" id="chapterPanel" hidden>
          <div class="card-title">选择章节</div>
          <div id="chapterList"></div>
        </div>

        <div class="panel" id="wrongPanel" hidden>
          <div class="card-title">错题重做 · 按题型</div>
          <div class="stat-bar">
            <span>未掌握 <b id="wsActive">0</b></span>
            <span>已掌握 <b id="wsMastered">0</b></span>
            <span>正确率 <b id="wsRate">--</b></span>
          </div>
          <div id="wrongTypeList"></div>
          <button class="btn btn-primary btn-block" id="redoAllBtn">全部重做</button>

          <div class="card-title" style="margin-top:16px">已掌握错题（可清理）</div>
          <div id="masteredList"></div>
          <button class="btn btn-block" id="clearMasteredBtn" style="margin-top:10px">清空已掌握</button>
        </div>
      </div>

      <div class="card" id="quizCard" hidden>
        <div class="quiz-top">
          <button class="back-btn back-inline" id="quizBack">‹ 返回</button>
          <span id="qTypeTag" class="tag"></span>
          <span class="muted" id="qProgressText"></span>
          <span class="top-actions">
            <button class="btn btn-sm" id="restartBtn">重新练习</button>
            <button class="btn btn-sm fav-btn" id="favBtn">☆ 收藏</button>
          </span>
        </div>
        <div class="answer-sheet" id="answerSheet"></div>
        <div class="q-stem" id="qStem"></div>
        <div id="qBody"></div>
        <div id="qFeedback" hidden></div>
        <div class="quiz-actions">
          <button class="btn" id="prevBtn">‹ 上一题</button>
          <button class="btn btn-primary" id="nextBtn" hidden>下一题 ›</button>
        </div>
      </div>
    </section>

    <!-- 错题视图 -->
    <section class="view" id="view-wrong" hidden>
      <div class="card">
        <div class="filter-row">
          <select id="wScope"><option value="active">未掌握</option><option value="mastered">已掌握</option></select>
          <button class="btn" id="exportWrong">导出错题</button>
        </div>
        <div id="wrongList"></div>
      </div>
    </section>

    <!-- 检索视图 -->
    <section class="view" id="view-search" hidden>
      <div class="card">
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="输入题干关键词，如：接发列车">
          <button class="btn btn-primary" id="searchBtn">搜索</button>
        </div>
        <div class="type-tabs" id="typeTabs">
          <button class="type-tab active" data-type="">全部</button>
          <button class="type-tab" data-type="single">单选题</button>
          <button class="type-tab" data-type="multi">多选题</button>
          <button class="type-tab" data-type="judge">判断题</button>
          <button class="type-tab" data-type="fill">填空题</button>
          <button class="type-tab" data-type="qa">简答题</button>
        </div>
        <div class="muted" id="searchSummary"></div>
        <div id="searchList"></div>
      </div>
    </section>

  </main>

  <!-- 底部导航 -->
  <nav id="tabbar">
    <button class="tab active" data-view="practice">练习</button>
    <button class="tab" data-view="search">检索</button>
    <button class="tab" data-view="import">导入</button>
  </nav>
</div>

<script src="lib/xlsx.full.min.js"></script>
<script src="lib/mammoth.browser.js"></script>
<script src="js/parser.js"></script>
<script src="js/judge.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<div id="toast"></div>
</body>
</html>
